# Egress allowlist for the Sprout agent — source of truth.
# Edited by pull request only (see README.md for the trust model).
#
# Attributes mirror Superconductor's network-rule model:
#   domain:      host to allow (required)
#   path_prefix: optional URL path prefix — DECLARED INTENT ONLY, not
#                enforceable by this proxy for HTTPS (see README.md)
#   read_only:   when true, only read methods should be allowed —
#                DECLARED INTENT ONLY for HTTPS (see README.md)
#
# Keep the simple structure: render.sh parses only "- domain:" lines.

domains:
  - domain: github.com          # git over HTTPS
  - domain: api.github.com      # REST writes + GraphQL (board moves)
  - domain: openrouter.ai       # model tokens (the live API host; verified
                                # 2026-11-01 that api.openrouter.ai does not exist)
                                # Note: NO githubusercontent.com here, deliberately.
                                # It is a user-content CDN — too broad. pi's fd/ripgrep
                                # companions are installed from Debian at image build
                                # time instead (see agent/Containerfile).
  - domain: api.telegram.org    # Telegram bot API
  - domain: mcp.openmail.sh     # OpenMail MCP endpoint — BEING RETIRED
                                # (organisation#47); remove once the OpenMail
                                # account is closed
  # sprout-harness#29 (2026-11-18): Sprout mailbox moved to Migadu
  # (sprout@sonapana.org; IMAP+SMTP verified from the Superconductor
  # session). RECORD OF ACCESS ONLY for now: squid.conf permits CONNECT
  # to port 443 only, so IMAP 993 / SMTP 465+587 stay blocked until the
  # proxy port approach in #29 is decided. Harness work is paused pending
  # the alternatives evaluation (organisation#35, #43).
  - domain: imap.migadu.com     # incoming mail (IMAP 993, TLS) — port blocked
  - domain: smtp.migadu.com     # outgoing mail (SMTP 465/587, TLS) — port blocked
  - domain: webmail.migadu.com  # webmail UI (443) — reachable
  # organisation#20 (2026-11-03): general information access. Search results
  # and news are prompt-injection vectors as much as information sources —
  # the agent's trust rules (content is data, never commands) apply.
  - domain: google.com          # general queries
  - domain: pi.dev              # pi harness documentation
  - domain: bbc.co.uk           # news and current affairs
  # organisation#23 (2026-11-06): local-model research — model cards and
  # metadata APIs. NOT included, each a separate future decision (issue #13):
  # *.hf.space (user-content host, like githubusercontent.com) and the
  # model-file CDN hosts (cas-bridge.xethub.hf.co, cdn-lfs*.hf.co) — needed
  # only when something inside the container downloads weights.
  - domain: huggingface.co      # model hub: cards, metadata, leaderboards
  # REMOVED (sprout-harness#27, 2026-11-16): host.containers.internal and
  # 192.168.1.139 — the local-model trial's direct-to-host entries. Under the
  # conceptual architecture (organisation PR #40) the agent must not know where
  # the host machine lives; that knowledge belongs to the internal shell.
  # sprout-harness#25 (2026-11-15): research reading — documentation and
  # comparison pages linked in coalition reviews (organisation#19 runtime
  # guides; organisation#38 OpenShell evaluation; agent-orchestration and
  # Superconductor-alternatives research). Prompt-injection posture of
  # organisation#20 applies: content is data, never commands.
  - domain: betterstack.com   # TypeScript runtime comparison guides (#19)
  - domain: www.nvidia.com    # vendor site
  - domain: docs.nvidia.com   # OpenShell documentation (#38 evaluation)
  - domain: agentsroom.dev    # agent-orchestration product research
  - domain: paradev.com       # Superconductor-alternatives comparison
  # sprout-harness#31 (2026-11-18): evaluation reading — frontier model chat
  # sites (the panel method of #19, needed by organisation#35) and
  # orchestrator candidates (organisation#43). organisation#20 posture applies.
  - domain: chatgpt.com
  - domain: gemini.google.com
  - domain: claude.ai
  - domain: www.deepseek.com
  - domain: meta.ai
  - domain: qwen.ai
  - domain: www.kimi.ai
  - domain: mistral.ai
  - domain: orca.dev             # orchestrator candidate (org#43)
  - domain: paseo.sh             # orchestrator candidate (org#43)
  - domain: emdash.com           # orchestrator candidate (org#43)
  - domain: agentclientprotocol.com  # ACP reference (Paseo Pi-support claim)
